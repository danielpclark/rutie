[package]
name = "rutie"
version = "0.11.0"
authors = [
  "Steve Klabnik <steve@steveklabnik.com>",
  "Dmitry Gritsay <unseductable@gmail.com>",
  "Daniel P. Clark <6ftdan@gmail.com>"
]
edition = "2021"

description = "The tie between Ruby and Rust."
repository = "https://github.com/danielpclark/rutie"
readme = "README.md"
keywords = ["cruby", "ruby", "rutie"]
license = "MIT"

build = "build.rs"
links = "ruby"

[features]
no-link = [] # tells build.rs to not link to libruby

[dependencies]
libc = "0.2.151"
lazy_static = "1.4.0"

# `build.rs` sets `rutie_dllimport` on Windows and declares it, but rustc warns
# about every `extern` block in `rubysys` whenever a build doesn't get that
# declaration from the build script, so it is declared here as well.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rutie_dllimport)"] }

[badges]
maintenance = { status = "actively-developed" }
