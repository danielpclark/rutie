name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  # Any base branch, so stacked release PRs are tested too.
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: ruby/setup-ruby has prebuilt 3.0 binaries for it
        # (Ruby 3.0 needs OpenSSL 1.1).
        os: [ubuntu-22.04, macos-latest, windows-latest]
        rust: [stable, beta]
        # Quoted, or YAML reads 3.0 as 3.
        ruby_version: ["3.0", "3.1", "3.2"]
    env:
      RUST_BACKTRACE: full
      CI_STDERR_LOG: true
      # Unit tests print each test's name as it starts on the Ruby thread, so
      # a crash (which kills the harness before it reports) names the test.
      RUTIE_TEST_TRACE: 1

    # macOS and Windows are best-effort for now.
    continue-on-error: ${{ matrix.os != 'ubuntu-22.04' }}

    steps:
    - uses: actions/checkout@v4

    # Prebuilt, shared-library Rubies. Static Ruby builds are no longer
    # tested: RVM's `--disable-shared` builds never produced a static
    # `libruby` to link against.
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby_version }}

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Build and Test
      run: |
        ruby --version
        cargo build -vv
        cargo test -vv

    # The examples use the crate the way users do: an embedding program, and
    # two Ruby extensions loaded through the `rutie` gem and tested with
    # minitest.
    - name: Build and test examples
      if: runner.os != 'Windows'
      run: |
        cargo run --example eval -- "raise 'eval example failed' unless 1 + 1 == 2"
        (cd examples/rutie_rust_example && cargo test)
        gem install --no-document rutie -v '~> 0.0.4'
        gem install --no-document minitest -v '~> 5.15.0'
        for example in rutie_ruby_example rutie_ruby_gvl_example; do
          (
            cd "examples/$example"
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              cargo rustc --release -- -C link-args=-Wl,-undefined,dynamic_lookup
            else
              cargo build --release
            fi
            ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].each { |f| require File.expand_path(f) }'
          )
        done

    # - name: After script
    #   run: |
    #     cat target/debug/build/rutie-*/output
    #     cat target/debug/build/rutie-*/stderr
