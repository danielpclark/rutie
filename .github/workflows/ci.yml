name: CI

on:
  push:
    branches:
      - master
      - 0.11-stable
    paths-ignore:
      - '**.md'
  # Any base branch, so stacked release PRs are tested too.
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: ruby/setup-ruby has prebuilt 3.0 binaries for it
        # (Ruby 3.0 needs OpenSSL 1.1).
        os: [ubuntu-22.04, macos-latest, windows-latest]
        rust: [stable, beta]
        ruby_version: ["3.0.7", "3.1.7", "3.2.9"]
        ruby_static: [false, true]
        exclude:
          # RubyInstaller ships no static Ruby.
          - os: windows-latest
            ruby_static: true
    env:
      RUST_BACKTRACE: full
      CI_STDERR_LOG: true
      # Unit tests print each test's name as it starts on the Ruby thread, so
      # a crash (which kills the harness before it reports) names the test.
      RUTIE_TEST_TRACE: 1

    # Static Ruby builds are best-effort, so they are not allowed to fail the
    # workflow.
    continue-on-error: ${{ matrix.ruby_static }}

    steps:
    - uses: actions/checkout@v4

    # Prebuilt, shared-library Rubies (RubyInstaller on Windows).
    - name: Setup Ruby
      if: matrix.ruby_static == false
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby_version }}

    # There are no prebuilt static Rubies, so build one. ruby-build fetches
    # OpenSSL 1.1 itself where Ruby needs it (3.0). A Ruby without a shared
    # library is linked statically without setting RUBY_STATIC. Ruby 3.2
    # enables YJIT when rustc is on PATH, and YJIT's Rust runtime in the
    # archive clashes with the test binary's (`rust_eh_personality`), so it
    # is turned off (configure only warns about it on 3.0).
    - name: Build static Ruby
      if: matrix.ruby_static == true
      run: |
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          brew install autoconf libyaml
        else
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libyaml-dev libffi-dev zlib1g-dev libgmp-dev libreadline-dev
        fi
        git clone --depth 1 https://github.com/rbenv/ruby-build.git "$RUNNER_TEMP/ruby-build"
        configure_opts="--disable-shared --disable-install-doc --disable-yjit"
        # Ruby 3.0's bundled bigdecimal doesn't compile with the current Apple
        # clang ("'maybe_unused' attribute cannot be applied to types"), and
        # Rutie doesn't use it.
        if [[ "$RUNNER_OS" == "macOS" && "${{ matrix.ruby_version }}" == 3.0.* ]]; then
          configure_opts="$configure_opts --with-out-ext=bigdecimal"
        fi
        # ruby-build only names its log on failure, so show the end of it.
        export TMPDIR="$RUNNER_TEMP"
        RUBY_CONFIGURE_OPTS="$configure_opts" \
          "$RUNNER_TEMP/ruby-build/bin/ruby-build" "${{ matrix.ruby_version }}" "$HOME/.rubies/${{ matrix.ruby_version }}" \
          || { tail -n 150 "$RUNNER_TEMP"/ruby-build.*.log; exit 1; }
        echo "$HOME/.rubies/${{ matrix.ruby_version }}/bin" >> "$GITHUB_PATH"

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    # Every rubysys declaration against this Ruby's headers and exports.
    - name: Check rubysys declarations
      if: runner.os == 'Linux'
      run: python3 ci/check_rubysys.py

    - name: Build and Test
      if: runner.os != 'Windows'
      run: |
        ruby -v
        ruby -e 'puts "ENABLE_SHARED=#{RbConfig::CONFIG["ENABLE_SHARED"]}"'
        cargo build -vv
        cargo test -vv

    # The examples use the crate the way users do: an embedding program, and
    # two Ruby extensions loaded through the `rutie` gem and tested with
    # minitest. Extensions built this way need a Ruby with a shared library.
    - name: Build and test examples
      if: runner.os != 'Windows' && matrix.ruby_static == false
      run: |
        cargo run --example eval -- "raise 'eval example failed' unless 1 + 1 == 2"
        (cd examples/rutie_rust_example && cargo test)
        gem install --no-document rutie -v '~> 0.0.4'
        gem install --no-document minitest -v '~> 5.15.0'
        for example in rutie_ruby_example rutie_ruby_gvl_example; do
          (
            cd "examples/$example"
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              # An extension uses the `ruby` process's libruby rather than
              # linking its own. With a static Ruby (setup-ruby's macOS 3.1 is
              # one) that would be a second VM that never booted.
              NO_LINK_RUTIE=1 cargo rustc --release -- -C link-args=-Wl,-undefined,dynamic_lookup
            else
              cargo build --release
            fi
            ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].each { |f| require File.expand_path(f) }'
          )
        done

    # MSVC toolchain (the runner's default Rust host) against RubyInstaller.
    - name: Build and Test (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        ruby -v
        cargo build -vv
        cargo test -vv

    # The GNU host toolchain brings its own MinGW linker.
    - name: Build and Test (Windows, GNU toolchain)
      if: runner.os == 'Windows'
      shell: bash
      env:
        CARGO_TARGET_DIR: target-gnu
      run: |
        rustup toolchain install ${{ matrix.rust }}-x86_64-pc-windows-gnu --profile minimal
        cargo +${{ matrix.rust }}-x86_64-pc-windows-gnu test -vv

    - name: Build and test examples (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cargo run --example eval -- "raise 'eval example failed' unless 1 + 1 == 2"
        (cd examples/rutie_rust_example && cargo test)
        gem install --no-document rutie -v '~> 0.0.4'
        gem install --no-document minitest -v '~> 5.15.0'
        for example in rutie_ruby_example rutie_ruby_gvl_example; do
          (
            cd "examples/$example"
            cargo build --release
            ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].each { |f| require File.expand_path(f) }'
          )
        done
